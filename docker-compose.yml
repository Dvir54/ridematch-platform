# Local services shared by all three sessions. Run from the main repo: docker compose up -d
name: ridematch
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridematch}
      POSTGRES_DB: ${POSTGRES_DB:-ridematch}
    ports: ["5434:5432"]   # host 5434: a native PostgreSQL service already uses 5432 on Dvir's machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ridematch}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
